<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightly Charting — Mag 7 + SPY</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--bg2:#111318;--bg3:#181c23;--bg4:#1e2330;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8eaf0;--text2:#8a90a0;--text3:#545968;--bull:#1fd98a;--bull-bg:rgba(31,217,138,0.08);--bull-bd:rgba(31,217,138,0.22);--bear:#f05252;--bear-bg:rgba(240,82,82,0.08);--bear-bd:rgba(240,82,82,0.22);--caut:#f5a623;--caut-bg:rgba(245,166,35,0.08);--caut-bd:rgba(245,166,35,0.22);--chop:#5a6078;--chop-bg:rgba(90,96,120,0.12);--swing:#6c8ef5;--swing-bg:rgba(108,142,245,0.1);--swing-bd:rgba(108,142,245,0.25);--accent:#6c8ef5;--mono:'DM Mono',monospace;--sans:'Syne',sans-serif;--r:10px;--rs:6px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
button{font-family:var(--sans);cursor:pointer;border:none;background:none}
.app{max-width:1100px;margin:0 auto;padding:0 20px 80px}
header{border-bottom:1px solid var(--border);padding:20px 0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:var(--bg);margin-bottom:28px}
.logo-main{font-size:15px;font-weight:600;letter-spacing:.03em}
.logo-sub{font-size:11px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);margin-left:10px}
.view{display:none}.view.active{display:block}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
.b-bull{background:var(--bull-bg);color:var(--bull)}.b-bear{background:var(--bear-bg);color:var(--bear)}.b-caut{background:var(--caut-bg);color:var(--caut)}.b-chop{background:var(--chop-bg);color:var(--chop)}.b-swing{background:var(--swing-bg);color:var(--swing);border:1px solid var(--swing-bd)}.b-note{background:rgba(255,255,255,.05);color:var(--text3)}.b-twoway{background:rgba(108,142,245,0.12);color:var(--accent)}
.session-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.session-card:hover{border-color:var(--border2)}
.sc-header{padding:16px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border)}
.sc-date{font-size:12px;font-weight:600;font-family:var(--mono);color:var(--accent);margin-bottom:3px}
.sc-title{font-size:15px;font-weight:600}
.sc-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.sc-body{padding:14px 20px}
.row-lbl{font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.name-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;font-family:var(--mono);border:1px solid transparent}
.chip-bull{background:var(--bull-bg);border-color:var(--bull-bd);color:var(--bull)}.chip-bear{background:var(--bear-bg);border-color:var(--bear-bd);color:var(--bear)}.chip-caut{background:var(--caut-bg);border-color:var(--caut-bd);color:var(--caut)}.chip-chop{background:var(--chop-bg);color:var(--chop)}.chip-twoway{background:rgba(108,142,245,0.12);border-color:rgba(108,142,245,0.35);color:var(--accent)}
.chip-dot{width:5px;height:5px;border-radius:50%}
.chip-bull .chip-dot{background:var(--bull)}.chip-bear .chip-dot{background:var(--bear)}.chip-caut .chip-dot{background:var(--caut)}.chip-chop .chip-dot{background:var(--chop)}.chip-twoway .chip-dot{background:var(--accent)}
.swing-section{background:var(--swing-bg);border:1px solid var(--swing-bd);border-radius:var(--rs);padding:11px 14px}
.swing-section-lbl{font-size:9px;font-family:var(--mono);color:var(--swing);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
.swing-chips{display:flex;gap:10px;flex-wrap:wrap}
.swing-chip-card{background:rgba(108,142,245,0.08);border:1px solid var(--swing-bd);border-radius:var(--rs);padding:7px 12px}
.swing-chip-name{font-size:13px;font-weight:600;color:var(--swing);font-family:var(--mono)}
.swing-chip-note{font-size:11px;color:rgba(108,142,245,0.65);font-family:var(--mono);margin-top:2px;line-height:1.4}
.back-btn{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text3);margin-bottom:24px;cursor:pointer;width:fit-content}
.back-btn:hover{color:var(--text2)}
.d-date{font-size:12px;font-family:var(--mono);color:var(--accent);letter-spacing:.06em;margin-bottom:5px}
.d-title{font-size:26px;font-weight:700;margin-bottom:22px}
.section-label{font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:12px}
.swing-banner{background:linear-gradient(135deg,rgba(108,142,245,0.1),rgba(108,142,245,0.05));border:1px solid var(--swing-bd);border-left:4px solid var(--swing);border-radius:0 var(--r) var(--r) 0;padding:1rem 1.25rem;margin-bottom:10px}
.swing-banner-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.swing-banner-title{font-size:14px;font-weight:600;color:var(--swing)}
.swing-banner-sub{font-size:11px;color:rgba(108,142,245,0.55);font-family:var(--mono)}
.swing-pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.swing-pill{background:rgba(108,142,245,0.07);border:1px solid var(--swing-bd);border-radius:var(--rs);padding:7px 10px}
.swing-pill-k{font-size:10px;font-family:var(--mono);color:rgba(108,142,245,0.55);margin-bottom:2px}
.swing-pill-v{font-size:12px;font-weight:600;font-family:var(--mono);color:var(--swing)}
.name-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:22px}
.ntab{padding:7px 13px;border-radius:var(--rs) var(--rs) 0 0;font-size:12px;font-weight:600;font-family:var(--mono);color:var(--text3);border:1px solid transparent;border-bottom:none;margin-bottom:-1px;transition:all .12s}
.ntab:hover{color:var(--text2)}
.ntab.active{background:var(--bg2);border-color:var(--border);border-bottom-color:var(--bg2);color:var(--text)}
.ntab.s-bull.active{color:var(--bull)}.ntab.s-bear.active{color:var(--bear)}.ntab.s-caut.active{color:var(--caut)}.ntab.s-chop.active{color:var(--chop)}.ntab.s-twoway.active{color:var(--accent)}
.swing-dot{width:5px;height:5px;border-radius:50%;background:var(--swing);display:inline-block;margin-left:4px;vertical-align:middle}
.npanel{display:none}.npanel.active{display:block}
.levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.level-pill{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:7px 11px}
.level-key{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:2px}
.level-val{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text)}
.smi-wrap{overflow-x:auto;margin-bottom:14px}
.smi-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.smi-tbl th{font-size:10px;font-family:var(--mono);color:var(--text3);text-align:left;padding:5px 10px;border-bottom:1px solid var(--border);letter-spacing:.05em;text-transform:uppercase}
.smi-tbl td{padding:6px 10px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.smi-tbl tr:last-child td{border-bottom:none}
.bull-t{color:var(--bull)}.bear-t{color:var(--bear)}.caut-t{color:var(--caut)}.dim{color:var(--text3)}
.thesis{background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 var(--rs) var(--rs) 0;padding:11px 14px;font-size:13px;line-height:1.7;color:var(--text2);margin-bottom:14px}
.thesis.bull-th{border-left-color:var(--bull)}.thesis.bear-th{border-left-color:var(--bear)}.thesis.caut-th{border-left-color:var(--caut)}
.hunt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.hunt-card{border-radius:var(--rs);padding:11px 13px;font-size:12.5px;line-height:1.6}
.hunt-up{background:rgba(31,217,138,0.06);border:1px solid var(--bull-bd);color:#a8f0d0}
.hunt-dn{background:rgba(240,82,82,0.06);border:1px solid var(--bear-bd);color:#f5b8b8}
.hunt-lbl{font-size:9px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;opacity:.6}
.plan-box{border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin-bottom:14px}
.plan-hdr{padding:7px 13px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:.07em;text-transform:uppercase}
.plan-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 13px;border-bottom:1px solid var(--border);font-size:13px}
.plan-row:last-child{border-bottom:none}
.plan-k{color:var(--text3);font-family:var(--mono);font-size:11px}
.plan-v{font-weight:600;font-family:var(--mono);font-size:12px;color:var(--text)}
.open-item{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text2);padding:7px 0;border-bottom:1px solid var(--border);line-height:1.5}
.open-item:last-child{border-bottom:none}
.open-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
.macro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.macro-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:11px 14px}
.macro-lbl{font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.macro-val{font-size:15px;font-weight:600}
.leg-card{border-radius:var(--rs);overflow:hidden;margin-bottom:10px}
.leg-card-call{border:1px solid var(--bull-bd);background:rgba(31,217,138,0.03)}
.leg-card-put{border:1px solid var(--bear-bd);background:rgba(240,82,82,0.03)}
.leg-card-hdr{padding:8px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.pm-section{padding:9px 13px;border-top:1px solid var(--border);background:var(--bg)}
.pm-lbl{font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.pm-row{font-size:12px;color:var(--text2);padding:2px 0;line-height:1.5}
.notes-section{padding:8px 13px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);line-height:1.6;font-family:var(--mono)}
.twoway-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
@media(max-width:600px){.hunt-grid{grid-template-columns:1fr}.twoway-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><span class="logo-main">Nightly Charting</span><span class="logo-sub">Mag 7 + SPY</span></div>
</header>

<div id="view-dash" class="view active">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div>
      <div style="font-size:22px;font-weight:700">Session Log</div>
      <div id="count-lbl" style="font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:3px"></div>
    </div>
  </div>
  <div id="session-list"></div>
</div>

<div id="view-detail" class="view">
  <div class="back-btn" onclick="showDash()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 12L6 8l4-4"/></svg>
    All sessions
  </div>
  <div id="detail-content"></div>
</div>
</div>

<script>
let SESSIONS=[];

// ─── Schema detection ───────────────────────────────────────────
function isNewSchema(n){ return Array.isArray(n.plans); }

// ─── Chip / badge style helpers ─────────────────────────────────
function getChipStyle(n){
  if(!isNewSchema(n)) return n.status||'chop';
  const plans=n.plans||[];
  if(n.status==='context') return 'chop';
  if(n.status==='off-list'){
    // Check if any plan has a real direction
    const dirs=plans.map(p=>p.direction).filter(d=>d&&d!=='none');
    if(dirs.length===0) return 'chop';
  }
  const dirs=plans.map(p=>p.direction).filter(d=>d&&d!=='none');
  // Use leg 1 as the primary color signal; fall back to any direction present
  const primary=plans.find(p=>p.leg===1)||plans[0];
  const primaryDir=primary?primary.direction:null;
  if(primaryDir==='call') return 'bull';
  if(primaryDir==='put') return 'bear';
  if(dirs.includes('call')) return 'bull';
  if(dirs.includes('put')) return 'bear';
  return 'chop';
}

function getStatusLabel(n){
  if(!isNewSchema(n)) return {bull:'Bullish',caut:'Caution',bear:'Bearish',chop:'No trade'}[n.status]||n.status;
  const plans=n.plans||[];
  const dirs=plans.map(p=>p.direction).filter(d=>d&&d!=='none');
  if(dirs.includes('call')&&dirs.includes('put')) return 'Two-Way';
  if(dirs.includes('call')) return n.status==='off-list'?'Call — React':'Call';
  if(dirs.includes('put')) return 'Put';
  if(n.status==='context') return 'Context';
  if(n.status==='off-list') return 'Off List';
  return 'No Trade';
}

function getBadgeClass(n){
  const s=getChipStyle(n);
  return {bull:'b-bull',bear:'b-bear',caut:'b-caut',chop:'b-chop',twoway:'b-twoway'}[s]||'b-note';
}

// ─── Data loading ────────────────────────────────────────────────
async function loadSessions(){
  try{
    const r=await fetch('sessions/index.json?t='+Date.now());
    const idx=await r.json();
    const all=await Promise.all(idx.map(f=>fetch('sessions/'+f+'?t='+Date.now()).then(r=>r.json())));
    SESSIONS=all.sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){SESSIONS=[];}
  renderDash();
}

function fmtDate(d){
  if(!d)return'—';
  const p=d.split('-');
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}

function showDash(){
  document.getElementById('view-dash').classList.add('active');
  document.getElementById('view-detail').classList.remove('active');
  window.scrollTo(0,0);
}
function showDetail(id){
  document.getElementById('view-dash').classList.remove('active');
  document.getElementById('view-detail').classList.add('active');
  renderDetail(id);
  window.scrollTo(0,0);
}

// ─── Dashboard ───────────────────────────────────────────────────
function renderDash(){
  const lbl=document.getElementById('count-lbl');
  const list=document.getElementById('session-list');
  lbl.textContent=SESSIONS.length+' session'+(SESSIONS.length!==1?'s':'')+' logged';
  if(!SESSIONS.length){
    list.innerHTML='<div style="text-align:center;padding:80px 20px;color:var(--text3)"><div style="font-size:18px;font-weight:600;color:var(--text2);margin-bottom:8px">No sessions yet</div></div>';
    return;
  }
  const toneMap={bull:'b-bull',bear:'b-bear','mixed-bullish':'b-caut','mixed-bearish':'b-caut',caut:'b-caut',chop:'b-chop'};
  const toneLbl={bull:'Risk On',bear:'Risk Off','mixed-bullish':'Mixed','mixed-bearish':'Mixed',caut:'Mixed',chop:'Chop'};
  list.innerHTML=SESSIONS.map(s=>{
    const namesArr=Array.isArray(s.names)?s.names:Object.values(s.names||{});
    const active=namesArr.filter(n=>n.status!=='skip');
    const swings=active.filter(n=>n.swing);
    // Sort by rankings array if present, else keep original order
    const rankList=Array.isArray(s.rankings)?s.rankings:[];
    const sortedActive=rankList.length?[...active].sort((a,b)=>{
      const ai=rankList.indexOf(a.name); const bi=rankList.indexOf(b.name);
      return(ai===-1?999:ai)-(bi===-1?999:bi);
    }):active;
    const chips=sortedActive.map(n=>{
      const cs=getChipStyle(n);
      const rank=rankList.length?rankList.indexOf(n.name)+1:0;
      const rankTag=rank>0?`<span style="font-size:9px;opacity:0.5;margin-right:2px;font-family:var(--mono)">#${rank}</span>`:'';
      return`<div class="name-chip chip-${cs}"><span class="chip-dot"></span>${rankTag}${n.name}</div>`;
    }).join('');
    const swingBlock=swings.length?`
      <div class="swing-section">
        <div class="swing-section-lbl">⚡ Active swings — separate capital</div>
        <div class="swing-chips">
          ${swings.map(n=>`<div class="swing-chip-card"><div class="swing-chip-name">${n.name}</div><div class="swing-chip-note">${n.swingNote||''}</div></div>`).join('')}
        </div>
      </div>`:'';
    return`<div class="session-card" onclick="showDetail('${s.id}')">
      <div class="sc-header">
        <div><div class="sc-date">${fmtDate(s.date)}</div><div class="sc-title">${s.title||'Nightly Chart Session'}</div></div>
        <div class="sc-meta">
          ${s.marketTone?`<span class="badge ${toneMap[s.marketTone]||'b-note'}">${toneLbl[s.marketTone]||s.marketTone}</span>`:''}
          ${swings.length?`<span class="badge b-swing">⚡ ${swings.length} swing${swings.length>1?'s':''}</span>`:''}
        </div>
      </div>
      <div class="sc-body">
        <div class="row-lbl">watchlist status</div>
        <div class="chips">${chips}</div>
        ${swingBlock}
      </div>
    </div>`;
  }).join('');
}

// ─── Macro ───────────────────────────────────────────────────────
function renderMacroBlock(s){
  if(!s.macro&&!s.spyClose) return '';
  let macroHtml='';
  if(typeof s.macro==='string'&&s.macro){
    macroHtml=`<div class="macro-card" style="grid-column:span 4"><div class="macro-lbl">Macro</div><div style="font-size:12.5px;color:var(--text2);line-height:1.7;margin-top:4px">${s.macro}</div></div>`;
  } else if(typeof s.macro==='object'&&s.macro){
    const fields=Object.entries(s.macro).filter(([,v])=>v&&v!=='TBD premarket');
    macroHtml=fields.map(([k,v])=>`<div class="macro-card"><div class="macro-lbl">${k}</div><div style="font-size:12px;color:var(--text2);line-height:1.5;margin-top:3px">${v}</div></div>`).join('');
  }
  return`<div class="macro-grid">
    ${s.spyClose?`<div class="macro-card"><div class="macro-lbl">SPY Close</div><div class="macro-val">${s.spyClose}</div></div>`:''}
    ${macroHtml}
  </div>`;
}

// ─── Levels ──────────────────────────────────────────────────────
function renderLevels(n){
  if(!n.levels) return '';
  let pills='';
  if(Array.isArray(n.levels)){
    pills=n.levels.filter(l=>l.k&&l.v).map(l=>`<div class="level-pill"><div class="level-key">${l.k}</div><div class="level-val">${l.v}</div></div>`).join('');
  } else {
    const map={pdh:'PDH',pdl:'PDL',orbH:'ORB H',orbL:'ORB L',ahh:'AHH',ahl:'AHL',pmh:'PMH',pml:'PML',worbh:'WORBH',worbl:'WORBL',lworbh:'Prior WORBH',lworbl:'Prior WORBL',fvg1:'FVG 1',fvg2:'FVG 2'};
    pills=Object.entries(map).filter(([k])=>{
      const v=n.levels[k];
      return v&&v!==0&&v!==0.00;
    }).map(([k,lbl])=>`<div class="level-pill"><div class="level-key">${lbl}</div><div class="level-val">${n.levels[k]}</div></div>`).join('');
  }
  return pills?`<div class="section-label">Key levels</div><div class="levels-grid">${pills}</div>`:'';
}

// ─── SMI ─────────────────────────────────────────────────────────
function renderSMI(n){
  const rows=(n.smi||[]).filter(r=>r.blue||r.orange||r.signal||r.cross);
  if(!rows.length) return '';
  const trs=rows.map(r=>{
    const sv=r.signal||r.cross||'';
    const sig=sv==='bull'?`<span class="bull-t">▲ Bull</span>`:sv==='bear'?`<span class="bear-t">▼ Bear</span>`:sv==='caut'?`<span class="caut-t">~ Stalling</span>`:`<span class="dim">—</span>`;
    const loc=r.location||r.dir||'';
    return`<tr><td class="dim">${r.tf}</td><td>${r.blue||'—'}</td><td>${r.orange||'—'}</td><td>${sig}</td><td class="dim" style="font-size:11px;max-width:200px">${loc}</td></tr>`;
  }).join('');
  return`<div class="section-label">SMI readings</div><div class="smi-wrap"><table class="smi-tbl"><thead><tr><th>TF</th><th>Blue</th><th>Orange</th><th>Signal</th><th>State</th></tr></thead><tbody>${trs}</tbody></table></div>`;
}

// ─── Plan rendering — old [{k,v}] format ─────────────────────────
function renderPlanOld(n){
  const plan=n.plan||[];
  if(!Array.isArray(plan)||!plan.length) return '';
  const rows=plan.map(p=>`<div class="plan-row"><span class="plan-k">${p.k}</span><span class="plan-v">${p.v}</span></div>`).join('');
  return`<div class="plan-box"><div class="plan-hdr">0DTE scalp plan</div>${rows}</div>`;
}

// ─── Plan rendering — new leg format ─────────────────────────────
function renderGates(plan){
  const gk={smiAlignment:'SMI align',levelIntegrity:'Level integrity',roomAvailable:'Room $3+',noRejectionWick:'No wick'};
  if(!plan.qualityGates) return '';
  const pills=Object.entries(gk).map(([k,lbl])=>{
    const pass=plan.qualityGates[k];
    const col=pass?'var(--bull)':'var(--bear)';
    const bg=pass?'rgba(31,217,138,0.07)':'rgba(240,82,82,0.07)';
    return`<span style="background:${bg};border:1px solid ${col};color:${col};border-radius:20px;font-size:10px;font-family:var(--mono);padding:2px 8px">${pass?'✓':'✗'} ${lbl}</span>`;
  }).join('');
  return`<div style="display:flex;gap:5px;flex-wrap:wrap;padding:7px 13px;border-top:1px solid var(--border)">${pills}</div>`;
}

function renderLegCard(plan){
  if(!plan) return '';
  const isCall=plan.direction==='call';
  const isPut=plan.direction==='put';
  const cardCls=isCall?'leg-card-call':isPut?'leg-card-put':'';
  const dirLabel=isCall?`<span style="color:var(--bull);font-weight:700;font-family:var(--mono);font-size:11px">▲ CALL</span>`:isPut?`<span style="color:var(--bear);font-weight:700;font-family:var(--mono);font-size:11px">▼ PUT</span>`:'';
  const slotBadge=plan.slot?`<span class="badge b-note">Slot ${plan.slot}</span>`:'';
  const scoreCol=plan.qualityScore===4?'var(--bull)':plan.qualityScore===3?'var(--caut)':'var(--bear)';
  const qBadge=plan.qualityScore!==undefined?`<span style="font-size:11px;color:${scoreCol};font-family:var(--mono);font-weight:600">${plan.qualityScore}/4</span>`:'';
  const sizeStr=plan.suggestedSize?`<span style="font-size:11px;color:var(--text2);font-family:var(--mono);font-weight:600">$${plan.suggestedSize.toLocaleString()}</span>`:'';

  const rows=[];
  if(plan.entryZone?.low&&plan.entryZone?.high&&plan.entryZone.low!==0)
    rows.push({k:'Entry zone',v:`${plan.entryZone.low} – ${plan.entryZone.high}`});
  if(plan.trigger&&plan.trigger!==0)
    rows.push({k:'Trigger',v:plan.trigger});
  if(plan.invalidation?.preEntry&&plan.invalidation.preEntry!==0)
    rows.push({k:'Pre-entry stop',v:plan.invalidation.preEntry});
  if(plan.invalidation?.postEntry&&plan.invalidation.postEntry!==0)
    rows.push({k:'Post-entry stop',v:plan.invalidation.postEntry});
  const targets=(plan.targets||[]).filter(t=>t&&t!==0);
  if(targets.length) rows.push({k:'Targets',v:targets.join(' → ')});

  const planRows=rows.map(r=>`<div class="plan-row"><span class="plan-k">${r.k}</span><span class="plan-v">${r.v}</span></div>`).join('');
  const seqBlock=plan.sequence?`<div style="padding:7px 13px;border-top:1px solid var(--border);font-size:11px;color:var(--accent);font-style:italic;font-family:var(--mono)">→ ${plan.sequence}</div>`:'';

  // Premarket — skip if N/A
  const pmV=plan.premarket?.validates;
  const pmI=plan.premarket?.invalidates;
  const pmVshow=pmV&&pmV!=='N/A'&&!pmV.startsWith('N/A');
  const pmIshow=pmI&&pmI!=='N/A'&&!pmI.startsWith('N/A');
  const pmBlock=(pmVshow||pmIshow)?`
    <div style="padding:10px 13px;border-top:2px solid var(--accent);background:rgba(108,142,245,0.04)">
      <div style="font-size:9px;font-family:var(--mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;font-weight:600">⏰ Premarket check — 8:45 AM</div>
      ${pmVshow?`<div style="font-size:12px;color:var(--text2);padding:3px 0;line-height:1.5">✅ ${pmV}</div>`:''}
      ${pmIshow?`<div style="font-size:12px;color:var(--text2);padding:3px 0;line-height:1.5">❌ ${pmI}</div>`:''}
    </div>`:''

  const notesBlock=plan.notes?`<div class="notes-section">${plan.notes}</div>`:'';
  const gatesBlock=renderGates(plan);

  return`<div class="leg-card ${cardCls}">
    <div class="leg-card-hdr">${dirLabel} ${slotBadge} ${qBadge} ${sizeStr}</div>
    ${planRows}
    ${seqBlock}
    ${gatesBlock}
    ${pmBlock}
    ${notesBlock}
  </div>`;
}

function renderOffListCard(plan){
  // For direction:none plans — show watch context and non-N/A premarket
  if(!plan||!plan.notes) return '';
  const pmV=plan.premarket?.validates;
  const pmI=plan.premarket?.invalidates;
  const pmVshow=pmV&&pmV!=='N/A'&&!pmV.startsWith('N/A');
  const pmIshow=pmI&&pmI!=='N/A'&&!pmI.startsWith('N/A');
  const pmBlock=(pmVshow||pmIshow)?`
    <div style="padding:10px 13px;border-top:1px solid var(--border)">
      <div style="font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Premarket watch</div>
      ${pmVshow?`<div style="font-size:12px;color:var(--text2);padding:2px 0;line-height:1.5">✅ ${pmV}</div>`:''}
      ${pmIshow?`<div style="font-size:12px;color:var(--text2);padding:2px 0;line-height:1.5">❌ ${pmI}</div>`:''}
    </div>`:'';
  return`<div style="border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin-bottom:10px">
    <div style="padding:7px 13px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:.07em;text-transform:uppercase">Watch context</div>
    <div style="padding:9px 13px;font-size:12px;color:var(--text3);line-height:1.6;font-family:var(--mono)">${plan.notes}</div>
    ${pmBlock}
  </div>`;
}

function renderPlansNew(n){
  const tradeable=(n.plans||[]).filter(p=>p.direction&&p.direction!=='none');
  const offList=(n.plans||[]).filter(p=>!p.direction||p.direction==='none');
  if(!tradeable.length){
    // Off-list: show watch context for first plan with notes
    const ctx=offList.find(p=>p.notes);
    return ctx?`<div class="section-label">Watch context</div>${renderOffListCard(ctx)}`:'';
  }
  if(tradeable.length===1){
    return`<div class="section-label">Setup plan</div>${renderLegCard(tradeable[0])}`;
  }
  // Two-way: side by side columns
  return`<div class="section-label">Two-way setup — both legs tracked</div>
    <div class="twoway-grid">
      ${tradeable.map(p=>renderLegCard(p)).join('')}
    </div>`;
}

// ─── Sizing block ─────────────────────────────────────────────────
function renderSizing(s){
  if(!s.sizing) return '';
  const sz=s.sizing;
  const items=[
    sz.baseEntry?{k:'Base entry',v:`$${sz.baseEntry.toLocaleString()}`}:null,
    sz.maxTrades?{k:'Max trades/day',v:sz.maxTrades}:null,
    sz.maxSimultaneousPositions?{k:'Max simultaneous',v:sz.maxSimultaneousPositions}:null,
    sz.dailyLossLimit?{k:'Stop trading if down',v:`$${sz.dailyLossLimit.toLocaleString()}`}:null,
    sz.walkAwayTarget?{k:'Walk away if up',v:`$${sz.walkAwayTarget.toLocaleString()}`}:null,
  ].filter(Boolean);
  const pills=items.map(i=>`<div class="level-pill"><div class="level-key">${i.k}</div><div class="level-val">${i.v}</div></div>`).join('');
  const noteLine=sz.notes?`<div style="padding:8px 0 2px;font-size:11px;color:var(--text3);font-family:var(--mono);line-height:1.5">${sz.notes}</div>`:'';
  return`<div class="card" style="margin-bottom:20px;border-color:rgba(108,142,245,0.2)">
    <div class="section-label" style="margin-bottom:10px">Session sizing rules</div>
    <div class="levels-grid" style="margin-bottom:${sz.notes?'4px':'0'}">${pills}</div>
    ${noteLine}
  </div>`;
}

// ─── Swing pills ─────────────────────────────────────────────────
function buildSwingPills(note){
  if(!note)return`<div class="swing-pill"><div class="swing-pill-k">Note</div><div class="swing-pill-v">—</div></div>`;
  const pills=[];
  const entryM=note.match(/entry[:\s]+([^.]+?)(?:[.,]|expiry|target|stop|size|$)/i);
  const expiryM=note.match(/expir\w+[:\s]+([^.]+?)(?:[.,]|entry|target|stop|size|$)/i);
  const targetM=note.match(/target[:\s]+([^.]+?)(?:[.,]|entry|expiry|stop|size|$)/i);
  const stopM=note.match(/stop[:\s]+([^.]+?)(?:[.,]|entry|expiry|target|size|$)/i);
  const sizeM=note.match(/size[:\s]+([^.]+?)(?:[.,]|entry|expiry|target|stop|$)/i);
  if(entryM)pills.push(['Entry zone',entryM[1].trim()]);
  if(expiryM)pills.push(['Expiry',expiryM[1].trim()]);
  if(targetM)pills.push(['Target',targetM[1].trim()]);
  if(stopM)pills.push(['Stop',stopM[1].trim()]);
  if(sizeM)pills.push(['Size',sizeM[1].trim()]);
  if(pills.length)return pills.map(([k,v])=>`<div class="swing-pill"><div class="swing-pill-k">${k}</div><div class="swing-pill-v">${v}</div></div>`).join('');
  return`<div class="swing-pill" style="grid-column:span 4"><div class="swing-pill-k">Parameters</div><div class="swing-pill-v" style="font-size:12px;line-height:1.5">${note}</div></div>`;
}

// ─── Rankings nav helper ─────────────────────────────────────────
function jumpToName(sessionId,name){
  const panelId='np-'+sessionId+'-'+name;
  const wrap=document.getElementById('detail-content');
  if(!wrap) return;
  const btn=wrap.querySelector(`.ntab[onclick*="${panelId}"]`);
  if(btn){ switchTab(btn,panelId); }
  const tabs=wrap.querySelector('.name-tabs');
  if(tabs) tabs.scrollIntoView({behavior:'smooth',block:'start'});
}

// ─── Rankings block ──────────────────────────────────────────────
function renderRankings(s){
  if(!Array.isArray(s.rankings)||!s.rankings.length) return '';
  const nameMap={};
  const rankNamesArr=Array.isArray(s.names)?s.names:Object.values(s.names||{});
  rankNamesArr.forEach(n=>{ nameMap[n.name]=n; });
  const colMap={bull:'var(--bull)',bear:'var(--bear)',caut:'var(--caut)',chop:'var(--text3)',twoway:'var(--accent)'};
  const bgMap={bull:'var(--bull-bg)',bear:'var(--bear-bg)',caut:'var(--caut-bg)',chop:'rgba(90,96,120,0.08)',twoway:'rgba(108,142,245,0.08)'};
  const bdMap={bull:'var(--bull-bd)',bear:'var(--bear-bd)',caut:'var(--caut-bd)',chop:'var(--border)',twoway:'rgba(108,142,245,0.25)'};
  const hoverBg={bull:'rgba(31,217,138,0.14)',bear:'rgba(240,82,82,0.14)',caut:'rgba(245,166,35,0.14)',chop:'rgba(90,96,120,0.18)',twoway:'rgba(108,142,245,0.14)'};
  const rows=s.rankings.map((name,i)=>{
    const n=nameMap[name]; if(!n) return '';
    const cs=getChipStyle(n);
    const col=colMap[cs]||'var(--text3)';
    const bg=bgMap[cs]||'var(--bg3)';
    const bd=bdMap[cs]||'var(--border)';
    const hbg=hoverBg[cs]||'rgba(255,255,255,0.05)';
    const primary=(n.plans||[]).find(p=>p.leg===1)||(n.plans||[])[0]||{};
    const dir=primary.direction==='call'?'▲ CALL':primary.direction==='put'?'▼ PUT':'';
    const dirCol=primary.direction==='call'?'var(--bull)':primary.direction==='put'?'var(--bear)':'var(--text3)';
    const isCaut=(primary.tier||'').includes('off-list')||(primary.qualityScore!==undefined&&primary.qualityScore<=2&&primary.direction==='call');
    const rawNote=(primary.notes||'').replace(/^Rank #\d+\.\s*/,'');
    const shortNote=rawNote.split(/\.\s/)[0].replace(/RS [+-]\d+\.\d+%[^.]+/,'').trim().substring(0,80);
    return`<div onclick="jumpToName('${s.id}','${name}')" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:${bg};border:1px solid ${bd};border-radius:var(--rs);cursor:pointer;transition:background .12s" onmouseover="this.style.background='${hbg}'" onmouseout="this.style.background='${bg}'">
      <span style="font-size:12px;font-weight:700;font-family:var(--mono);color:var(--text3);min-width:24px">#${i+1}</span>
      <span style="font-size:14px;font-weight:700;font-family:var(--mono);color:${col};min-width:54px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:${col}40">${name}</span>
      <span style="font-size:11px;font-weight:600;font-family:var(--mono);color:${dirCol};min-width:52px">${dir}</span>
      ${isCaut?'<span style="font-size:10px;font-family:var(--mono);color:var(--caut);white-space:nowrap">⚠️ CAUTION</span>':''}
      <span style="font-size:11px;color:var(--text3);font-family:var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${shortNote}</span>
      <span style="font-size:10px;color:var(--text3);font-family:var(--mono);opacity:0.5">→</span>
    </div>`;
  }).filter(Boolean).join('');
  return`<div class="card" style="margin-bottom:20px;border-color:rgba(108,142,245,0.2)">
    <div class="section-label" style="margin-bottom:10px">Rankings — trade in this order</div>
    <div style="display:flex;flex-direction:column;gap:5px">${rows}</div>
  </div>`;
}

// ─── Detail view ─────────────────────────────────────────────────
function renderDetail(id){
  const s=SESSIONS.find(x=>x.id===id);
  if(!s)return;
  const el=document.getElementById('detail-content');
  const namesArr2=Array.isArray(s.names)?s.names:Object.values(s.names||{});
  const active=namesArr2.filter(n=>n.status!=='skip');
  const swings=active.filter(n=>n.swing);

  const swingSummary=swings.length?`
    <div style="margin-bottom:24px">
      <div class="section-label" style="margin-bottom:10px">⚡ Active swing positions — separate capital, separate rules</div>
      ${swings.map(n=>`
        <div class="swing-banner">
          <div class="swing-banner-hdr">
            <span class="swing-banner-title">${n.name}</span>
            <span class="swing-banner-sub">swing trade · not 0DTE · different capital</span>
          </div>
          <div class="swing-pills">${buildSwingPills(n.swingNote)}</div>
        </div>`).join('')}
    </div>`:'';

  const openBlock=(s.openItems&&s.openItems.length)?`
    <div class="card" style="margin-bottom:20px">
      <div class="section-label" style="margin-bottom:10px">Open items</div>
      ${s.openItems.map(i=>`<div class="open-item"><span class="open-dot"></span>${i}</div>`).join('')}
    </div>`:'';

  // macro filter block (new schema)
  let macroFilterBlock='';
  if(s.macroFilter){
    macroFilterBlock=`<div class="card" style="margin-bottom:20px">
      <div class="section-label" style="margin-bottom:8px">9:20 direction lock</div>
      <div style="font-size:12px;color:var(--text3);font-family:var(--mono);margin-bottom:8px">${s.macroFilter.rule||''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div style="background:var(--bull-bg);border:1px solid var(--bull-bd);border-radius:var(--rs);padding:9px 12px">
          <div style="font-size:9px;font-family:var(--mono);color:var(--bull);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Bull &gt; ${s.macroFilter.bullThreshold}</div>
          <div style="font-size:11px;color:var(--text2);line-height:1.4">${s.macroFilter.bullScenario||''}</div>
        </div>
        <div style="background:var(--caut-bg);border:1px solid var(--caut-bd);border-radius:var(--rs);padding:9px 12px">
          <div style="font-size:9px;font-family:var(--mono);color:var(--caut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Mixed</div>
          <div style="font-size:11px;color:var(--text2);line-height:1.4">${s.macroFilter.mixedScenario||''}</div>
        </div>
        <div style="background:var(--bear-bg);border:1px solid var(--bear-bd);border-radius:var(--rs);padding:9px 12px">
          <div style="font-size:9px;font-family:var(--mono);color:var(--bear);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px">Bear &lt; ${s.macroFilter.bearThreshold}</div>
          <div style="font-size:11px;color:var(--text2);line-height:1.4">${s.macroFilter.bearScenario||''}</div>
        </div>
      </div>
    </div>`;
  }

  const tabs=active.map((n,i)=>{
    const cs=getChipStyle(n);
    return`<button class="ntab s-${cs} ${i===0?'active':''}" onclick="switchTab(this,'np-${s.id}-${n.name}')">${n.name}${n.swing?'<span class="swing-dot"></span>':''}</button>`;
  }).join('');

  const panels=active.map((n,i)=>{
    const slbl=getStatusLabel(n);
    const sbadge=getBadgeClass(n);
    const isNew=isNewSchema(n);

    // Old format fields
    const tcls={bull:'bull-th',bear:'bear-th',caut:'caut-th'}[n.status]||'';
    const thesisHtml=n.thesis?`<div class="section-label">Thesis</div><div class="thesis ${tcls}">${n.thesis}</div>`:'';
    const huntHtml=(n.huntUp||n.huntDn)?`<div class="section-label">Stop hunt map</div><div class="hunt-grid"><div class="hunt-card hunt-up"><div class="hunt-lbl">▲ Upside</div>${n.huntUp||'—'}</div><div class="hunt-card hunt-dn"><div class="hunt-lbl">▼ Downside</div>${n.huntDn||'—'}</div></div>`:'';
    const planHtml=isNew?renderPlansNew(n):renderPlanOld(n);

    const swingInPanel=n.swing?`
      <div class="swing-banner" style="margin-bottom:14px">
        <div class="swing-banner-hdr">
          <span class="swing-banner-title">⚡ Swing position</span>
          <span class="swing-banner-sub">separate capital · separate rules · losing scalp never closes this</span>
        </div>
        <div class="swing-pills">${buildSwingPills(n.swingNote)}</div>
      </div>`:'';

    const closeLbl=n.close?`<span style="font-size:12px;font-family:var(--mono);color:var(--text3)">Close: ${n.close}</span>`:'';
    const openLbl=n.open?`<span style="font-size:12px;font-family:var(--mono);color:var(--text3)">Open: ${n.open}</span>`:'';

    return`<div class="npanel ${i===0?'active':''}" id="np-${s.id}-${n.name}">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <span class="badge ${sbadge}">${slbl}</span>
        ${n.swing?'<span class="badge b-swing">⚡ Swing</span>':''}
        ${openLbl} ${closeLbl}
      </div>
      ${swingInPanel}
      ${renderSMI(n)}
      ${renderLevels(n)}
      ${thesisHtml}
      ${huntHtml}
      ${planHtml}
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="d-date">${fmtDate(s.date)}</div>
    <div class="d-title">${s.title||'Nightly Chart Session'}</div>
    ${renderRankings(s)}
    ${renderMacroBlock(s)}
    ${macroFilterBlock}
    ${renderSizing(s)}
    ${swingSummary}
    ${openBlock}
    ${active.length?`<div class="name-tabs">${tabs}</div><div>${panels}</div>`:'<div style="color:var(--text3)">No name data recorded.</div>'}
  `;
}

function switchTab(btn,panelId){
  const wrap=btn.closest('#detail-content');
  wrap.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  wrap.querySelectorAll('.npanel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(panelId).classList.add('active');
}

loadSessions();
</script>
